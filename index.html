 falls.forEach(f=>{const c=f.c;const w=c.offsetWidth,h=c.offsetHeight;c.width=Math.max(1,w*DPR);c.height=Math.max(1,h*DPR);f.w=w;f.h=h;
  const n=f.k==='g'?Math.round(w/2.2)*2:Math.round(w/3)*3;f.s=[];
  for(let i=0;i<n;i++)f.s.push(f.k==='g'?{x:R(0,w),sw:R(.8,4),len:R(60,280),v:R(420,760),a:R(.18,.73),ph:Math.random()*1e3,sp:Math.random()<.45?0:1}:{x:w*(.25+Math.random()*.5),sw:R(1,3.2),len:R(30,100),v:R(195,350),a:R(.18,.73),ph:Math.random()*1e3,sp:Math.random()<.45?0:1});
  if(f.body){const g=c.getContext('2d');}});
 dusts.forEach(d=>{const c=d.c;c.width=c.offsetWidth*DPR;c.height=c.offsetHeight*DPR;d.w=c.offsetWidth;d.h=c.offsetHeight;
  if(!d.p.length)for(let i=0;i<d.n;i++)d.p.push({u:Math.random(),v:Math.random(),r:Math.random(),ph:Math.random()*6.3,sp:R(.4,1.2)})});
 sc.style.display='block';document.body.style.height=sc.offsetHeight+'px';
}
function visible(el){const r=el.getBoundingClientRect();return r.bottom>-50&&r.top<innerHeight+50}
function drawFall(f,t){
 const c=f.c;if(!visible(c))return;const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,f.w,f.h);
 if(f.body){const gr=g.createLinearGradient(0,0,f.w,0);gr.addColorStop(0,'rgba(80,150,255,0)');gr.addColorStop(.18,'rgba(90,175,255,.7)');gr.addColorStop(.5,'rgba(175,238,255,.96)');gr.addColorStop(.82,'rgba(90,175,255,.7)');gr.addColorStop(1,'rgba(80,150,255,0)');g.fillStyle=gr;g.fillRect(0,0,f.w,f.h)}
 g.globalCompositeOperation='lighter';
 f.s.forEach(s=>{const span=f.h+s.len;let y=((t*s.v*f.sp+s.ph)%span)-s.len;let a=s.a;if(f.k==='g'){const d=Math.abs(s.x/f.w-.5)*2;a*=1-d*d*.6}
  g.globalAlpha=a;const im=SP[f.k][s.sp];g.drawImage(im,s.x,y,s.sw,s.len);g.drawImage(im,s.x,y-span,s.sw,s.len)});
 g.globalAlpha=1;
}
function drawDust(d,t){
 const c=d.c;if(!visible(c))return;const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,d.w,d.h);
 const[bx,by,bw,bh]=d.b.map((v,i)=>v/100*(i%2?d.h:d.w));
 d.p.forEach(p=>{let x,y,r,a,col;
  switch(d.kind){
  case'wisp':{const up=(t*.02*p.sp+p.v)%1;const v=.98-up*.65;x=d.w*(.2+.6*p.u)+Math.sin(t*.6+p.ph)*d.w*.012;y=d.h*(v+.0);r=.8+p.r*1.8;a=Math.min(1,up/.25)*Math.abs(Math.sin(2*t+p.ph))*.8;col='190,240,255';break}
  case'mote':{const v=(p.v-t*.008*p.sp)%1;x=bx+p.u*d.w*0+d.w*p.u+Math.sin(t*.4+p.ph)*d.w*.02;y=(v<0?v+1:v)*d.h;r=.6+p.r*1.4;a=.25+p.r*.5;col='170,225,255';break}
  case'spray':{const life=(t*p.sp*.8+p.ph)%1;x=bx+bw*(p.u+(p.r-.5)*.6*life);y=by+bh*(p.v*.3+life*life*.9);r=.7+p.r*1.6;a=1-life;col='200,245,255';break}
  case'bubble':{const life=(t*p.sp*.16+p.ph)%1;x=bx+bw*p.u+Math.sin(t*1.4)*bw*.03;y=by+bh*(1-life);r=(2+p.r*7)*d.w/1440;a=Math.sin(life*Math.PI)*.9;
   const gr=g.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);gr.addColorStop(0,`rgba(255,240,180,${a})`);gr.addColorStop(.6,`rgba(255,170,70,${.55*a})`);gr.addColorStop(1,'rgba(255,170,70,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.3);g.fill();return}
  case'shimmer':{const sp=.3+.7*p.v;x=bx+bw*(.5+(p.u-.5)*sp);y=by+bh*p.v;a=Math.max(0,Math.sin(t*(1.2+2*p.r)+p.ph))*.8;g.fillStyle=`rgba(255,240,205,${a})`;g.fillRect(x,y,12+p.r*20,1.2);return}}
  g.fillStyle=`rgba(${col},${a})`;g.beginPath();g.arc(x,y,r,0,6.3);g.fill()});
}
/* scroll + input */
let cur=0,mx=-999,my=-999,lx=0,ly=0,last=performance.now();
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
const lamp=document.getElementById('lamp');
addEventListener('resize',()=>{sizeAll()});
addEventListener('load',sizeAll);
sizeAll();
/* intro */
const EZ='cubic-bezier(.2,.8,.2,1)';
if(!rm){
 letters.forEach((l,i)=>l.animate([{transform:'translateY(110%)'},{transform:'none'}],{duration:1200,delay:250+i*70,easing:EZ,fill:'backwards'}));
 sub.animate([{wordSpacing:'1.4em',transform:'translateY(14px)',clipPath:'inset(0 50% 0 50%)'},{wordSpacing:'.3em',transform:'none',clipPath:'inset(0)'}],{duration:1600,delay:900,easing:EZ,fill:'backwards'});
 heroArt.animate([{transform:'scale(1.09)'},{transform:'scale(1)'}],{duration:2600,easing:EZ,composite:'add'});
 document.getElementById('nav').animate([{transform:'translateY(-100%)'},{transform:'none'}],{duration:900,delay:500,easing:EZ,fill:'backwards'});
}
function reveal(r){r.done=1;if(rm)return;const ls=r.c.querySelectorAll('.ln>span');ls.forEach((s,i)=>s.animate([{transform:'translateY(105%)'},{transform:'none'}],{duration:1000,delay:i*80,easing:EZ,fill:'backwards'}));
 r.c.querySelectorAll('.rule').forEach(e=>e.animate([{transform:'scaleX(0)'},{transform:'none'}],{duration:1100,delay:160,easing:EZ,fill:'backwards'}))}
if(rm)reveals.forEach(r=>r.done=1);
/* frame */
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 const sy=scrollY;cur=rm?sy:(Math.abs(sy-cur)<.05?sy:cur+(sy-cur)*(1-Math.exp(-7.5*dt)));
 sc.style.transform=`translate3d(0,${-cur}px,0)`;
 const hh=heroSec.offsetHeight;heroArt.style.transform=`translate3d(0,${cur*.32}px,0)`;
 heroCopy.style.transform=`translate3d(-50%,${cur*.55}px,0)`;
 h1.style.transform='scale('+(1+Math.min(1,Math.max(0,cur/hh))*.1)+')';
 lx+=(mx-lx)*(1-Math.exp(-10*dt));ly+=(my-ly)*(1-Math.exp(-10*dt));lamp.style.transform=`translate3d(${lx}px,${ly}px,0)`;
 const tt=rm?0:t;
 falls.forEach(f=>drawFall(f,tt));dusts.forEach(d=>drawDust(d,tt));
 if(!rm){
  ghosts.forEach(g=>{const aw=g.art.offsetWidth,ah=g.art.offsetHeight;
   const dx=Math.sin(.35*t+g.ph)*.012*aw,dy=Math.sin(.9*t+g.ph)*.014*ah;
   const r=g.e.getBoundingClientRect();const cx=r.left+r.width/2-g.ox,cy=r.top+r.height/2-g.oy;
   let tx=0,ty=0;const vx=cx-mx,vy=cy-my,d=Math.hypot(vx,vy);
   if(d<260&&d>0){const p=Math.pow(1-d/260,1.5)*90;tx=vx/d*p;ty=vy/d*p}
   const k=1-Math.exp(-3*dt);g.ox+=(tx-g.ox)*k;g.oy+=(ty-g.oy)*k;
   g.e.style.transform=`translate3d(calc(-50% + ${dx+g.ox}px),calc(-50% + ${dy+g.oy}px),0) rotate(${Math.sin(.7*t+g.ph)*6+g.ox*.05}deg)`});
  bats.forEach(b=>{const p=((t/b.dur+b.off)%1);const aw=b.art.offsetWidth;const x=-8+116*p;const y=b.y0+Math.sin(p*9+b.off*6)*(1+b.off*3);
   b.e.style.left=x+'%';b.e.style.top=y+'%';b.e.style.height='auto';
   const dn=Math.floor(t*b.fl)%2;const k=dn?'dn':'up';if(b.k!==k){b.k=k;crop(b.e,k)}b.e.style.aspectRatio=(dn?195/221:203/221)+''})
 }
 reveals.forEach(r=>{if(!r.done&&r.c.getBoundingClientRect().top<innerHeight*.8)reveal(r)});
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* anchors: native jump, easing glides */
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const id=a.getAttribute('href').slice(1);const s=document.getElementById(id);if(!s)return;e.preventDefault();
 const seams=[...sc.children];let y=0;for(const el of seams){if(el===s)break;y+=el.offsetHeight}scrollTo(0,id==='finale'?y:y)}));
})();
</script>
